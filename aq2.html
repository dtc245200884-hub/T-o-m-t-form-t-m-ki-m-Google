<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm Bing</title>
</head>
<body>

    <h2>Tìm kiếm với Bing</h2>
    
    <!-- Đổi action sang trang tìm kiếm của Bing -->
    <form action="https://www.bing.com/search" method="GET"> 
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm..." required />
        <input type="submit" value="Tìm bằng Bing" />
    </form>

</body>
</html>
